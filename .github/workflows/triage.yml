# Free, AI-less sorting of new issues: labels from the issue form, a friendly first reply,
# and a gentle nudge when a bug report has no run log.
name: Triage new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    if: github.repository == 'DeusesPR/Sloth-Mod'  # never in the private dev copy (no free minutes there)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const { owner, repo } = context.repo;

            // Labels this workflow may add, created on first use.
            const palette = {
              "bug": "d73a4a", "idea": "a2eeef", "question": "d876e3", "needs-log": "fbca04",
              "fabric": "dbab79", "neoforge": "f29513", "forge": "1d76db",
              "mc-26.x": "0e8a16", "mc-1.21.1": "5319e7", "mc-1.20.1": "b60205",
              "area: making mods": "c5def5", "area: art & sounds": "c5def5", "area: testing in game": "c5def5",
              "area: big project": "c5def5", "area: discover": "c5def5", "area: my mods": "c5def5",
              "area: setup & settings": "c5def5", "area: installer & updates": "c5def5",
            };
            async function ensure(name) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch { await github.rest.issues.createLabel({ owner, repo, name, color: palette[name] || "ededed" }).catch(() => {}); }
            }

            // Read "### Heading\n\nanswer" sections of an issue form.
            const sections = {};
            for (const part of body.split(/^### /m).slice(1)) {
              const nl = part.indexOf("\n");
              sections[part.slice(0, nl).trim().toLowerCase()] = part.slice(nl + 1).trim();
            }
            const find = (word) => Object.entries(sections).find(([k]) => k.includes(word))?.[1] || "";

            const labels = new Set(issue.labels.map((l) => (typeof l === "string" ? l : l.name)));
            const isBug = labels.has("bug") || "what happened?" in sections;
            const isIdea = !isBug && (labels.has("idea") || labels.has("enhancement") || "describe it in plain english" in sections || /idea/i.test(issue.title));
            if (isBug) labels.add("bug"); else if (isIdea) labels.add("idea"); else labels.add("question");

            const mc = find("minecraft").toLowerCase();
            if (/neoforge/.test(mc)) labels.add("neoforge");
            else if (/\bforge\b/.test(mc)) labels.add("forge");
            if (/fabric/.test(mc)) labels.add("fabric");
            if (/\b26\.\d/.test(mc)) labels.add("mc-26.x");
            if (/1\.21\.1/.test(mc)) labels.add("mc-1.21.1");
            if (/1\.20\.1/.test(mc)) labels.add("mc-1.20.1");

            const area = find("where did it happen").toLowerCase();
            const areas = [
              ["making a mod", "area: making mods"], ["art", "area: art & sounds"], ["testing", "area: testing in game"],
              ["big project", "area: big project"], ["discover", "area: discover"], ["my mods", "area: my mods"],
              ["setup", "area: setup & settings"], ["installer", "area: installer & updates"],
            ];
            for (const [k, l] of areas) if (area.includes(k)) { labels.add(l); break; }

            const log = find("log");
            const noLog = isBug && (!log || /^_?no response_?$/i.test(log) || log.length < 40);
            if (noLog) labels.add("needs-log");

            for (const l of labels) await ensure(l);
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [...labels] });

            let msg;
            if (isBug) {
              msg = "Thanks for reporting this! 🦥 A maintainer will take a look soon.";
              if (noLog) msg += "\n\nIt would help a lot to see the run log: in Sloth-Mod, open the failed run and press **Copy run log** (or **Open log folder** and attach `last-run.log` from your mod's `.sloth/logs` folder), then paste it in a comment. Please remove anything private first.";
            } else if (isIdea) {
              msg = "Thanks for the idea! 🦥 Ideas with the most 👍 reactions get looked at first.";
            } else {
              msg = "Thanks for reaching out! 🦥 For general questions, [Discussions](https://github.com/" + owner + "/" + repo + "/discussions) is often faster.";
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: msg });
